		/**
		Deering, S. (2011). Get URL parameters using jQuery. Retrieved April 13, 2020 from https://www.sitepoint.com/url-parameters-jquery/
		 **/
		function extractURL(name){
			var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
			if (results==null){
			   return null;
			}
			else{
			   return results[1] || 0;
			}
		}
		
		function changeURL(content, params = {}) {
			/**
		Nolasco, F. (2013). How do we update URL or query strings using javascript/jQuery without reloading the page? Answer by user Fabio Nolasco. Retrieved April 13, 2020 from https://stackoverflow.com/a/19279268
		 **/
			if (history.pushState) {
				var url = window.location.protocol + "//" + window.location.host + window.location.pathname + '?content=' + content;

				if ('product_id' in params){
					url += '&product_id=' + params['product_id'];
				}
				
				if ('category_id' in params){
					url += '&category_id=' + params['category_id'];
				}

				window.history.pushState({path:url},'',url);
			}
		}

		function placePresents(content, category_id = null, product_id = null){
			
			if (content == "category"){
				let category_present = ContentObject.products_json["categories"][category_id]["present"];
				
				if (!JSON.parse(localStorage.getItem("user_presents")).includes(category_present[1])){
					let spotId = "categoryPresent_spot" + category_present[0];
					
					document.getElementById(spotId).innerHTML = '<div id="'+ category_present[1] +'" class="present" onclick="collectPresent(this, '+ category_present[1] +')">🎁</div>';
				}
			}
			else if (content == "product"){
				let product_obj = ContentObject.products_json["categories"][category_id]["produkte"][product_id];
				
				if ("present" in product_obj){
					if (!JSON.parse(localStorage.getItem("user_presents")).includes(product_obj["present"])){
						
						document.getElementById("product_present_e").innerHTML = '<div id="'+ product_obj["present"] +'" class="present" onclick="collectPresent(this, '+ product_obj["present"] +')">🎁</div>'; 
					}
				}
			}
		}
		
		function collectPresent(present, present_id){
			event.stopPropagation();
			let userPresentArray = JSON.parse(localStorage.getItem("user_presents"));
			userPresentArray.push(present_id);
			localStorage.setItem("user_presents",  JSON.stringify(userPresentArray));

			// Get the bounding box of the coin
			const coinRect = present.getBoundingClientRect();

			// Calculate the center of the viewport
			const viewportCenterX = window.innerWidth / 2;
			const viewportCenterY = window.innerHeight / 2;

			// Calculate the offset to move the coin to the center of the screen
			const xOffset = viewportCenterX - coinRect.left - coinRect.width / 2;
			const yOffset = viewportCenterY - coinRect.top - coinRect.height / 2;

			// Set a higher z-index while moving
			present.style.zIndex = "1001";

			// Apply a transform using translate3d for smoother rendering
			present.style.transform = `translate3d(${xOffset}px, ${yOffset}px, 0) scale(2)`;

			// Add the moving class to animate smoothly
			present.classList.add("moving");
			
			// Shake the coin dynamically when it reaches the middle
			setTimeout(() => {
			  let shakeCount = 0;
			  const shakeInterval = setInterval(() => {
				if (shakeCount >= 6) {
				  clearInterval(shakeInterval); // Stop shaking after 6 rotations
				  return;
				}

				// Alternate between rotating left (-15deg) and right (15deg)
				const rotation = shakeCount % 2 === 0 ? -250 : 250;
				present.style.transform = `translate3d(${xOffset}px, ${yOffset}px, 0) scale(0) rotate(${rotation}deg)`;
				shakeCount++;
			  }, 100); // Change rotation every 100ms
			}, 900); // Start shaking after the movement finishes (1s)
			
			setTimeout(() => {
				localStorage.user_present_count = Number(localStorage.user_present_count) + 1;
				document.getElementById("present_count").innerHTML = localStorage.user_present_count;
				updateGame();
			}, 1300);
			
			setTimeout(() => {
				triggerGame(Number(localStorage.user_present_count));
			}, 1800);
			
			setTimeout(() => {
				present.classList.add("hidden"); 
			}, 2400);
		}

		}

		function openChatMessage(message_content, fadeout=true){
			
			let messageElement = document.getElementById("side_message");
			let timeout_time = 6000;
			
			if (messageElement.classList.contains('show')){
				messageElement.classList.add("slide-out");
					
				setTimeout(() => {
					messageElement.classList.remove("slide-out");
					messageElement.classList.add('hidden');
					messageElement.classList.remove("show");
					
					messageElement.innerHTML = message_content;
			
					messageElement.classList.remove('hidden');
					messageElement.classList.add('show');
					timeout_time = timeout_time + 6000;
				}, 500); // Match animation duration (0.5s)
			}
			else {
				messageElement.innerHTML = message_content;
				
				messageElement.classList.remove('hidden');
				messageElement.classList.add('show');
			}
			
			if (fadeout){
				setTimeout(() => {
					
					messageElement.classList.add("slide-out");
					
					setTimeout(() => {
						messageElement.classList.remove("slide-out");
						messageElement.classList.remove("show");
						messageElement.classList.add('hidden');
					}, 500); // Match animation duration (0.5s)
					
				}, timeout_time);
			}
		}

 von 0,8 l ist beutellos und lässt sich mit der praktischen EasyClean-Funktion leicht entleeren. Dank der 3 elektronischen Saugstufen (Max., Mid., Min.) können Sie die Leistung des Stielsaugers ganz nach Bedarf anpassen. Besonders praktisch ist das bewegliche 180° Gelenk, das eine flexible Handhabung und die Reinigung auch in schwer zugänglichen Bereichen ermöglicht. Der Jet 65 PetPRO ist mit einer Jet Fit Bürste für Teppich- und Hartböden ausgestattet, sowie mit einer Mini-Turbodüse und einer 2-in-1 Kombidüse, um Tierhaare und Staub effizient zu entfernen. Ideal auch für Allergiker und Haushalte mit Haustieren. Die Akkulaufzeit von bis zu 40 Minuten ermöglicht eine gründliche Reinigung ohne ständiges Nachladen. Die Ladezeit beträgt lediglich 3,5 Stunden, sodass der Stielsauger schnell wieder einsatzbereit ist. Der leistungsstarke Lithium-Ionen-Akku sorgt für eine stabile Leistung über die gesamte Betriebszeit. <ul><li>Akkubetrieb mit 21,6 Volt Lithium-Ionen-Akku</li><li>3 Leistungsstufen für individuelle Saugkraft</li><li>Jet Fit Bürste für Teppiche und Hartböden</li><li>Mit Mini-Turbodüse, 2-in-1 Kombidüse und Teleskop-Fugendüse</li><li>Beutelloses System mit EasyClean-Funktion</li><li>Flexibles 180° Gelenk für einfache Handhabung</li><li>Bis zu 40 Minuten Betriebsdauer</li><li>3,5 Stunden Ladezeit</li><li>Leichtes Gewicht von 2,3 kg</li></ul>Im Lieferumfang enthalten sind der Akkustaubsauger, Jet Fit Bürste, Pet Tool, 2-in-1 Kombidüse, Teleskop-Fugendüse, ein wechselbarer Akku, eine 2-in-1 Ladestation, Netzteil und die Bedienungsanleitung. Der SAMSUNG Jet 65 PetPRO ist die ideale Wahl für eine gründliche, effiziente und flexible Reinigung – perfekt für Haushalte mit Haustieren und Allergikern.</p>","name_kurz":"SAMSUNG VS15A60BGR5/WD Jet 65 PetPRO"},{"id":"vacuum_2","name":"MIELE Classic C1 Flex Staubsauger, maximale Leistung: 800 Watt","brand":"MIELE","Artikelnummer":"2795048","img":"Vacuum_Bild_2.webp","preis":"159,99 €","beschreibung":"<p> Der MIELE Classic C1 Flex Staubsauger bietet Ihnen hervorragende Reinigungskraft und ist mit einer maximalen Leistung von 800 Watt besonders effizient. Mit einem großzügigen Aktionsradius von 9 Metern eignet sich dieser Staubsauger hervorragend für große Räume und sorgt für eine gründliche Reinigung. Der Filterbeutel mit AirClean Filter garantiert dabei eine besonders saubere Luft und fängt selbst feinsten Staub sicher auf. Mit einem Staubbehältervolumen von 4,5 Litern bietet der MIELE Classic C1 Flex ausreichend Platz für den aufgesaugten Staub und muss seltener geleert werden. Der Staubsauger verfügt über eine Filterwechselanzeige, die Sie rechtzeitig informiert, wenn es Zeit ist, den Filter zu wechseln. Dank der elektronischen 6-stufigen Drehregler können Sie die Saugleistung des Staubsaugers präzise an den jeweiligen Bodenbelag anpassen. Die Universal-Bodendüse SBD 355-3 und die Flexible Fugendüse SFD 20 sorgen dafür, dass alle Bereiche Ihres Haushalts gründlich gereinigt werden – vom Teppich bis zu den schmalsten Ecken. Das praktische Parksystem für Saugpausen ermöglicht es Ihnen, das Saugrohr während der Reinigung bequem abzustellen, ohne dass es umkippt. Mit dem Silence-System können Sie zudem besonders leise saugen, ohne den Geräuschpegel zu erhöhen. Weitere Merkmale des MIELE Classic C1 Flex Staubsaugers sind das dreiteilige Zubehör am VarioClip, ein großes Staubbeutelvolumen und der praktische Rotary Switch für die einfache Steuerung der Leistung. <ul><li>Maximale Leistung von 800 Watt</li><li>Aktionsradius von 9 Metern</li><li>AirClean Filter für saubere Luft</li><li>6-stufiger elektronischer Drehregler</li><li>Universal-Bodendüse und Flexible Fugendüse</li><li>Praktisches Parksystem für Saugpausen</li><li>Großes Staubbeutelvolumen von 4,5 Litern</li><li>Silence-System für leisen Betrieb</li><li>Robustes Edelstahl-Saugrohr und 5,5 m Anschlusskabel</li></ul>Der MIELE Classic C1 Flex Staubsauger ist die ideale Wahl für anspruchsvolle Reinigung, die sowohl gründlich als auch komfortabel ist. Er eignet sich für alle Arten von Böden und sorgt für eine saubere und allergenfreie Umgebung in Ihrem Zuhause.</p>","name_kurz":"MIELE Classic C1 Flex"},{"id":"vacuum_3","name":"DYSON 492636-01 V8 ADVANCED Stielsauger, Akkubetrieb, 425 Watt","brand":"DYSON","Artikelnummer":"2942515","img":"Vacuum_Bild_3.webp","preis":"339,- €","preis_angebot":"","beschreibung":"<p>Der DYSON 492636-01 V8 ADVANCED Stielsauger bietet mit seiner maximalen Leistung von 425 Watt und einer beeindruckenden maximalen Saugleistung von 130 AW eine herausragende Reinigungsleistung auf allen Böden. Ideal für die tägliche Reinigung und die Bekämpfung von Staub und Schmutz in jedem Raum, sorgt der Akkusauger mit seiner hocheffizienten Filtration für saubere Luft, indem er Schmutz, Staub und Allergene zuverlässig entfernt. Dank des praktischen, beutellosen Systems mit einem Staubbehältervolumen von 0.54 l lässt sich der Staubbehälter einfach entleeren, ohne dabei in Kontakt mit dem Staub zu kommen. Der Staubsauger ist mit einem Vormotorfilter und Nachmotorfilter ausgestattet, die beide waschbar sind und eine langanhaltende Leistung gewährleisten. Die Motorbar Elektrobürste ist speziell für die gründliche Reinigung von Teppichen und Hartböden konzipiert und entfernt auch hartnäckigen Schmutz und Tierhaare. Die Tierbürste sorgt für eine effektive Entfernung von Tierhaaren auf Polstermöbeln und anderen Oberflächen. Der DYSON V8 ADVANCED Stielsauger überzeugt zudem mit einer maximalen Betriebsdauer von 40 Minuten und einer Ladezeit von nur 5 Stunden. Der praktische Handstaubsauger ist ideal für schwer zugängliche Stellen wie Ritzen oder Möbelspalten. <p><strong>Weitere Merkmale:</p></strong><ul><li>Beutellose Technik für hygienische Handhabung</li><li>Inklusive Wandhalterung mit Ladefunktion</li><li>Filterwechselanzeige und Steuerung am Handgriff</li><li>4 Zubehördüsen für flexible Anwendungen: Motorbar Elektrobürste, Kombidüse, Fugendüse, Tierbürste</li></ul>Der DYSON V8 ADVANCED Stielsauger ist der perfekte Begleiter für eine gründliche, schnelle und einfache Reinigung in Ihrem Zuhause. Mit seiner starken Leistung, flexiblen Handhabung und zuverlässigen Filtration stellt er sicher, dass Ihr Zuhause jederzeit sauber und hygienisch bleibt.</p>","name_kurz":"DYSON 492636-01 V8 ADVANCED"},{"id":"vacuum_4","name":"SIEMENS VSQ5X1238 Staubsauger, maximale Leistung: 850 Watt","brand":"SIEMENS","Artikelnummer":"1672515","img":"Vacuum_Bild_4.webp","preis":"159,99 €","preis_angebot":"","beschreibung":"<p>Der SIEMENS VSQ5X1238 Staubsauger kombiniert eine starke Leistung von 850 Watt mit besonders leisen Betriebsgeräuschen von nur 70 dB (A). Mit seinem Aktionsradius von 13 m ermöglicht er eine große Reichweite und sorgt für eine effiziente Reinigung in größeren Räumen oder Wohnungen. Dank des HEPA-Hygienefilters, der waschbar ist, bietet dieser Staubsauger nicht nur eine gründliche Reinigung, sondern auch eine hohe Luftqualität, indem er feinste Staubpartikel auffängt. Der Staubbeutel hat ein Volumen von 4.5 l und ist mit 5 Filterbeuteln im Lieferumfang ausgestattet, die für eine längere Nutzung sorgen. Die SilentClean Premium Rollendüse sorgt für eine besonders gründliche Reinigung auf Teppichen und Hartböden. Mit der praktischen Umschaltbaren Rollendüse und den weiteren Aufsätzen wie der Polsterdüse und Fugendüse eignet sich der Staubsauger für eine Vielzahl von Oberflächen und schwer zugängliche Stellen. Ein weiteres praktisches Feature ist die elektronische Saugkraftregulierung, die eine einfache Anpassung der Saugkraft per Drehregler ermöglicht. Das automatische Kabelaufwicklungssystem sorgt für eine ordentliche und platzsparende Aufbewahrung des Kabels nach dem Gebrauch. Der SIEMENS VSQ5X1238 Staubsauger eignet sich besonders für die Reinigung von Hartholzböden, Parkettböden, Teppichen und Möbeln und bietet mit der softBumper Protection zusätzlichen Schutz für Möbel und Wände. Dank des Filtersystems ist der Staubsauger besonders gut für Haushalte mit Allergikern geeignet. <p><strong>Weitere Merkmale:</strong></p><ul><li>Besonders leise umschaltbare Rollendüse für extra gründliche Reinigung</li><li>Automatische Kabelaufwicklung für einfache Handhabung</li><li>4 Lenkrollen für hohe Mobilität</li><li>Inklusive 5 Filterbeuteln und praktischen Düsen</li></ul>Mit seinem eleganten Schwarz Design und der hohen Leistung ist der SIEMENS VSQ5X1238 Staubsauger die perfekte Wahl für eine effiziente und hygienische Reinigung in Ihrem Zuhause.</p>","name_kurz":"SIEMENS VSQ5X1238"},{"id":"vacuum_5","name":"MIELE DUOFLEX HX1 Stielsauger, Akkubetrieb, 25,2 Volt","brand":"MIELE","Artikelnummer":"2896751","img":"Vacuum_Bild_5.webp","preis":"329,99 €","preis_angebot":"","beschreibung":"<p>Der MIELE DUOFLEX HX1 Stielsauger kombiniert beeindruckende Leistung und Flexibilität in einem Gerät. Mit seinem leistungsstarken 25,2 Volt Lithium-Ionen Akku bietet der Staubsauger eine Betriebsdauer von bis zu 55 Minuten im Minimalmodus und bis zu 12 Minuten im maximalen Saugmodus, was eine effiziente Reinigung großer Flächen ermöglicht. Mit einer Flächenleistung von 60 m² eignet sich der MIELE DUOFLEX HX1 ideal für die Reinigung von Fliesen, Parkettböden, Teppichen und Möbeln. Der beutellose Staubbehälter mit einem Volumen von 0,3 l ist besonders einfach zu entleeren und sorgt für eine hygienische Handhabung. Die elektronische Saugkraftregulierung ermöglicht eine präzise Anpassung der Leistung in 2 Stufen, um verschiedene Oberflächen effektiv zu reinigen. Dank der Vortex-Technologie und des Digital Efficiency Motors erzielt der Staubsauger eine kraftvolle Saugleistung bei geringem Energieverbrauch. Für eine gründliche Reinigung auf allen Oberflächen sorgt die Elektrobürste HX-EB 20 MultiFloor, die sowohl für Teppiche als auch für Hartböden geeignet ist. Das vielseitige Zubehör, darunter die Fugendüse HX-CN, die Polsterdüse HX-UN und der Saugpinsel HX-DB, ermöglicht eine präzise Reinigung in engen Ecken und an Möbeln. <p><strong>Weitere Merkmale:</strong></p><ul><li>Bis zu 55 Minuten Laufzeit im Minimalmodus und bis zu 12 Minuten Laufzeit im Maximalmodus</li><li>Komfortable Zubehör-Aufbewahrung für eine ordentliche Aufbewahrung</li><li>Praktische elektronische Saugkraftregulierung</li><li>Leistungsstarker Digital Efficiency Motor und Vortex-Technologie für eine effektive Reinigung</li><li>Kompakte und leichte Bauweise für einfache Handhabung und Flexibilität</li></ul>Der MIELE DUOFLEX HX1 Stielsauger vereint Innovation, Flexibilität und Leistung in einem stilvollen Design. Mit der Farbe Brillantweiß passt er perfekt in jedes Zuhause und sorgt für eine gründliche und komfortable Reinigung auf allen Oberflächen.</p>","name_kurz":"MIELE DUOFLEX HX1"},{"id":"vacuum_6","name":"ROWENTA RO3725 Compact Power Cyclonic Classic Staubsauger, maximale Leistung: 750 Watt","brand":"ROWENTA","Artikelnummer":"2945471","img":"Vacuum_Bild_6.webp","preis":"79,99 €","preis_angebot":"","beschreibung":"<p>Der ROWENTA RO3725 Compact Power Cyclonic Classic Staubsauger überzeugt durch starke Leistung und praktische Handhabung. Mit einer maximalen Leistung von 750 Watt und beutelloser Zyklonfilter-Technologie entfernt dieser Staubsauger effizient Staub und Schmutz von allen Oberflächen. Der 1,5 l Staubbehälter ermöglicht eine lange Nutzung ohne häufiges Entleeren. Der Aktionsradius von 8,8 m bietet genügend Reichweite, um größere Räume mühelos zu reinigen. Dank der kombinierten Bürste für Teppiche und Hartböden können Sie sowohl auf weichen als auch auf harten Oberflächen eine gründliche Reinigung erzielen. Mit einem Schallleistungspegel von 79 dB(A) arbeitet der Staubsauger leise und effizient. Die automatische Kabelaufwicklung und das teleskopische Rohr bieten zusätzlichen Komfort, indem sie das Verstauen und Anpassen der Saugrohrlänge erleichtern. <p><strong>Besondere Merkmale:</strong></p><ul><li><strong>Beutellose Zyklon-Technologie</strong> für eine einfache und hygienische Entleerung</li><li><strong>Große Räder</strong> für müheloses Überwinden von Hindernissen und komfortables Manövrieren</li><li><strong>6,2 m Kabellänge</strong> für eine gute Reichweite bei der Reinigung</li><li>Ideal für Fliesen, Parkettböden, Teppiche, Möbel und mehr</li></ul>Der ROWENTA RO3725 Compact Power Cyclonic Classic Staubsauger ist der perfekte Helfer für eine gründliche Reinigung in Ihrem Zuhause. Mit seinem kompakten Design und der starken Leistung bietet er Ihnen alles, was Sie für eine einfache und effektive Reinigung benötigen.</p>","name_kurz":"ROWENTA RO3725 Compact Power Cyclonic Classic"},{"id":"vacuum_7","name":"PHILIPS FC9331/09 PowerPro Compact 3000 Serie beutellos, Staubsauger, maximale Leistung: 900 Watt","brand":"PHILIPS","Artikelnummer":"2229891","img":"Vacuum_Bild_7.webp","preis":"129,99 €","preis_angebot":"","beschreibung":"<p>Der PHILIPS FC9331/09 PowerPro Compact 3000 Serie Staubsauger bietet Ihnen eine starke und beutellose Reinigungskraft mit innovativer PowerCyclone 5-Technologie. Mit einer maximalen Leistung von 900 Watt und einem Luftstrom von 27,8 l/s sorgt er für eine gründliche Reinigung auf allen Oberflächen. Dank des beutellosen Systems mit einem 1,5 l Staubbehälter und einem leicht entleerbaren Behälter wird das Entleeren besonders einfach und hygienisch. Der Allergiefilter sorgt für saubere Luft und ist zudem waschbar, wodurch der Staubsauger besonders pflegeleicht bleibt. Mit der TriActive-Düse und der Hartbodendüse können Sie sowohl Teppiche als auch empfindliche Hartböden mühelos reinigen. Der Staubsauger ist mit einem teleskopischen Rohr ausgestattet, das sich an Ihre Bedürfnisse anpasst, und einer integrierten Bürste für zusätzliche Flexibilität.<br>Der PHILIPS FC9331/09 Staubsauger überzeugt durch:<ul><li><strong>PowerCyclone 5-Technologie</strong> für leistungsstarke Saugleistung</li><li><strong>Leicht entleerbaren Staubbehälter</strong> mit 1,5 l Volumen</li><li><strong>Allergiefilter</strong>, der die Luft reinigt und waschbar ist</li><li><strong>Aktionsradius von 9 m</strong> für größere Reichweite bei der Reinigung</li><li><strong>Besondere Düse für Hartböden</strong>, die mühelos Staub und Schmutz entfernt</li><li><strong>Fugendüse</strong> und integrierte Bürste für flexible Reinigung</li></ul>Der Staubsauger eignet sich hervorragend für Hartholzböden, Parkettböden und Teppiche, wobei er dank seiner kompakten Größe und seines leichten Gewichts auch problemlos in engen Räumen verwendet werden kann. Mit der praktischen Zubehörhalterung am Gerät ist alles immer griffbereit.</p>","name_kurz":"PHILIPS FC9331/09 PowerPro Compact 3000"},{"id":"vacuum_8","name":"CLATRONIC BS 1306 N Stielsauger, maximale Leistung: 600 Watt","brand":"CLATRONIC","Artikelnummer":"2194805","img":"Vacuum_Bild_8.webp","preis":"54,99 €","preis_angebot":"","beschreibung":"<p>Der CLATRONIC BS 1306 N Stielsauger ist ein kompakter und leistungsstarker Staubsauger für vielseitige Anwendungen in Ihrem Haushalt. Mit einer maximalen Leistung von 600 Watt und einem praktischen Netzbetrieb sorgt dieser Stielsauger für eine kontinuierlich starke Saugleistung. Der HEPA-Filter sorgt für eine gründliche Filtration und eignet sich hervorragend für Allergiker, da er selbst feinste Staubpartikel aus der Luft entfernt. Dank des beutellosen Systems mit einem 0,5 l Staubbehälter wird das Entleeren kinderleicht und hygienisch. Der Multifilter gewährleistet eine effiziente Staubaufnahme und hält die Luft sauber. Dieser Staubsauger ist mit einem praktischen 2-teiligen Aluminium-Saugrohr ausgestattet, das für eine bequeme Handhabung sorgt und sich ideal für unterschiedliche Höhen und Winkel eignet. Zudem verfügt der CLATRONIC BS 1306 N über eine Fugendüse und eine Bodenbürste für eine effektive Reinigung auf allen Oberflächen.<br>Der Staubsauger überzeugt durch:<ul><li><strong>Maximale Leistung von 600 Watt</strong> für starke Saugleistung</li><li><strong>HEPA-Filter</strong> für Allergiker und eine saubere Luft</li><li><strong>Beutelloses System</strong> mit einem 0,5 l Staubbehälter</li><li><strong>Multifiltersystem</strong> für bessere Filtration</li><li>Praktisches 2-teiliges Aluminium-Saugrohr für flexibles Saugen</li><li><strong>Komfortable Wandhalterung</strong> für platzsparende Aufbewahrung</li></ul>Der CLATRONIC BS 1306 N Stielsauger ist besonders geeignet für Fliesen, Hartböden und Teppiche. Mit seinem 6500 mm langen Anschlusskabel haben Sie ausreichend Reichweite, um auch größere Flächen problemlos zu reinigen. Er ist die ideale Wahl für Haushalte, die auf eine effektive und schnelle Reinigung angewiesen sind.</p>","name_kurz":"CLATRONIC BS 1306 N"},{"id":"vacuum_9","name":"SIEMENS VS06A111 synchropower Staubsauger, maximale Leistung: 600 Watt","brand":"SIEMENS","Artikelnummer":"2144127","img":"Vacuum_Bild_9.webp","preis":"82,99 €","preis_angebot":"","beschreibung":"<p>Der SIEMENS VS06A111 Synchropower Staubsauger ist ein leistungsstarker Zylinderstaubsauger, der mit einer maximalen Leistung von 600 Watt für eine gründliche Reinigung sorgt. Mit seinem großen Staubbeutelvolumen von 4 l und dem praktischen Hygienefilter ist dieser Staubsauger perfekt für Haushalte, die auf Sauberkeit und Allergikerfreundlichkeit Wert legen. Der Filter ist zudem waschbar und sorgt dafür, dass die Luft frei von Staubpartikeln bleibt. Dank der elektronischen Saugkraftregulierung und dem elektronischen Drehregler können Sie die Saugkraft individuell an verschiedene Bodenarten und Verschmutzungen anpassen. Für eine bequeme Handhabung sorgt das praktische Teleskoprohr, das sich perfekt an Ihre Bedürfnisse anpassen lässt, sowie das automatische Kabelaufwicklungssystem für eine platzsparende Aufbewahrung. Der Staubsauger ist mit einer umschaltbaren Rollendüse, einer Fugendüse und einer Polsterdüse ausgestattet, die eine vielseitige Anwendung auf verschiedenen Oberflächen ermöglichen. Er eignet sich hervorragend für die Reinigung von Hartholzböden, Parkettböden, Teppichen, Fliesen und Möbeln. <p><strong>Besondere Merkmale:</strong></p><ul><li><strong>Maximale Leistung von 600 Watt</strong> für kraftvolle Saugleistung</li><li><strong>Hygienefilter</strong> für saubere Luft und Allergikerfreundlichkeit</li><li><strong>Beutelloses System</strong> mit 4 l Vliesbeutel</li><li><strong>Elektronische Saugkraftregulierung</strong> für optimale Reinigungsergebnisse</li><li><strong>Teleskoprohr und praktisches Kabelaufwicklungssystem</strong></li><li><strong>Vielseitiges Zubehör</strong> (Rollendüse, Fugendüse, Polsterdüse) für verschiedene Anwendungen</li></ul>Der SIEMENS VS06A111 Synchropower Staubsauger bietet Ihnen eine komfortable und effektive Lösung für die tägliche Reinigung in Ihrem Zuhause. Mit seiner starken Leistung und praktischen Funktionen ist er der ideale Helfer für ein sauberes Zuhause.</p>","name_kurz":"SIEMENS VS06A111"},{"id":"vacuum_10","name":"ROWENTA RH2039 X-Force Flex 9.60 Allergy Stielsauger, Akkubetrieb, 250 Watt","brand":"ROWENTA","Artikelnummer":"2823257","img":"Vacuum_Bild_10.webp","preis":"179,- €","preis_angebot":"","beschreibung":"<p>Der ROWENTA RH2039 Stielsauger bietet eine perfekte Kombination aus Leistung und Komfort, ideal für eine gründliche und effiziente Reinigung Ihres Zuhauses. Mit einer beeindruckenden maximalen Betriebsdauer von 45 Minuten und einer Ladezeit von nur 4 Stunden sorgt dieser Staubsauger für eine konstante und starke Saugkraft bei maximaler Autonomie. Das Smart Control Display ermöglicht eine einfache Steuerung und zeigt Ihnen die aktuelle Lade- und Filterstatusanzeige an. Die automatische Anpassung der Saugkraft passt sich perfekt an Ihre Bedürfnisse an, während das Flex-Gelenk Ihnen maximale Flexibilität bei der Reinigung von schwer erreichbaren Stellen bietet. Der ROWENTA RH2039 Stielsauger ist mit einem leistungsstarken 18,5 Volt Lithium-Ionen-Akku ausgestattet, der für nachhaltigen Betrieb sorgt. Er erfüllt die Kriterien von BetterWay, da er weniger als 400 Watt verbraucht, was ihn besonders umweltfreundlich und kosteneffizient macht. Das schlanke und kompakte Design des Geräts ermöglicht eine komfortable Handhabung, und die praktische LED-Düse sorgt für eine gründliche Reinigung, auch in dunklen Ecken. Die Inklusive Handstaubsauger bietet zusätzlich Flexibilität und macht den RH2039 zu einem echten Allrounder. <p><strong>Lieferumfang:</strong></p> Stielsauger, Ladestation, Fugendüse, Polsterbürste, Ladegerät und Schnellstart-Anleitung. <p><strong>Besondere Merkmale:</strong></p> Flex-Gelenk, LED-Düse, Smart Control Display, automatische Saugkraftanpassung, BetterWay Technologie.</p>","name_kurz":"ROWENTA RH2039 X-Force Flex 9.60"},{"id":"vacuum_11","name":"SIEMENS VSQ5X1230 Staubsauger, maximale Leistung: 850 Watt","brand":"SIEMENS","Artikelnummer":"1504210","img":"Vacuum_Bild_11.webp","preis":"139,99 €","preis_angebot":"","beschreibung":"<p>Der SIEMENS VSQ5X1230 Staubsauger überzeugt durch starke Leistung und vielseitige Funktionen, die Ihr Zuhause gründlich reinigen – von Hartböden bis Teppichen. Mit einer maximalen Leistung von 850 Watt und einem Aktionsradius von 13 m bietet dieser Staubsauger Flexibilität und Effizienz in jedem Raum. Die umschaltbare Rollendüse SilentClean sorgt dabei für eine geräuschoptimierte und gleichmäßige Reinigung auf allen Bodenarten. Ausgestattet mit einem HEPA-Filter, der waschbar ist, fängt der Staubsauger selbst kleinste Partikel ein und trägt zur Verbesserung der Luftqualität bei – besonders wichtig für Allergiker. Der 4,5 l Staubbeutel bietet eine große Kapazität für längere Einsatzzeiten ohne häufiges Entleeren. Die elektronische Saugkraftregulierung ermöglicht es Ihnen, die Leistung präzise nach Bedarf anzupassen. Mit der automatischen Kabelaufwicklung und dem Teleskoprohr ist der Staubsauger besonders benutzerfreundlich und lässt sich problemlos verstauen. Dank des Filtersperrensystems wird eine optimale Filterwirkung gewährleistet, ohne dass der Filter versehentlich entfernt wird. <p><strong>Besondere Merkmale:</strong></p> <ul><li>Maximale Leistung von 850 Watt für kraftvolle Reinigung ndsanzeige machen die Bedienung besonders einfach und intuitiv. Die Oberfläche aus hochwertigem Edelstahl mit einer fingerabdruckresistenten Lackierung und die abnehmbaren Teile wie der Filterhalter sorgen für eine besonders einfache Reinigung. Die automatische Abschaltautomatik sorgt zudem für zusätzliche Sicherheit. Die Kaffeemaschine ist ideal für den täglichen Gebrauch und überzeugt durch hohe Leistung und elegantes Design.<p><strong>Lieferumfang:</strong></p><ul><li>Kaffeemaschine inkl. Glaskanne</li><li>Filterhalter und Bedienungsanleitung</li></ul></p>","name_kurz":"RUSSELL HOBBS 23241-56"},{"id":"coffee_2","name":"PHILIPS HD7546/20 Café Gaia mit Thermokanne aus Edelstahl, 1,2 Liter, 1000 Watt, Kaffeemaschine Schwarz/Silber","brand":"PHILIPS","Artikelnummer":"1019418","img":"Kaffee_Bild_2.webp","preis":"69,- €","preis_angebot":"","beschreibung":"<p>Die PHILIPS HD7546/20 Café Gaia Kaffeemaschine in stilvollem Schwarz/Silber bietet Ihnen alles, was Sie für eine perfekte Tasse Kaffee benötigen. Mit einer maximalen Leistung von 1000 Watt und einem Fassungsvermögen von 1,2 l bereitet sie bis zu 15 Tassen köstlichen Kaffee zu. Die hochwertige Thermokanne aus Edelstahl hält Ihren Kaffee länger heiß und bewahrt das volle Aroma. Dank der praktischen Tropfstopp-Funktion können Sie den Brühvorgang jederzeit unterbrechen, ohne dass etwas daneben geht. Die Kaffeemaschine ist mit einem Schwenkfilter ausgestattet, der für eine einfache Handhabung sorgt. Der Füllstandsanzeige ermöglicht es Ihnen, den Wasserstand jederzeit im Blick zu behalten. Die PHILIPS Café Gaia Kaffeemaschine punktet mit einem schlichten, modernen Design, das sich in jede Küche einfügt. Sie bietet eine einfache Bedienung ohne unnötigen Schnickschnack und überzeugt durch eine Abschaltautomatik für mehr Sicherheit. Die Teile sind spülmaschinenfest, was die Reinigung besonders unkompliziert macht.<p><strong>Lieferumfang:</strong></p><ul><li>Kaffeemaschine</li><li>Thermokanne aus Edelstahl</li><li>Bedienungsanleitung</li></ul></p>","name_kurz":"PHILIPS HD7546/20 Café Gaia"},{"id":"coffee_3","name":"BRAUN PurAroma 7 KF 7120 Kaffeemaschine Edelstahl/Schwarz","brand":"BRAUN","Artikelnummer":"2178957","img":"Kaffee_Bild_3.webp","preis":"99,99 €","preis_angebot":"","beschreibung":"<p>Die BRAUN PurAroma 7 KF 7120 Kaffeemaschine ist die perfekte Wahl für Kaffeeliebhaber, die auf Qualität und Geschmack nicht verzichten möchten. Mit einer maximalen Leistung von 1000 Watt und einem Fassungsvermögen des Wassertanks von 1,66 l können Sie bis zu 12 Tassen köstlichen Kaffee zubereiten. Dank des OptiBrew Systems und der Brausekopf-Technologie wird das volle Aroma aus Ihrem Kaffee herausgeholt. Die Aroma-Glaskanne mit einer Füllmenge von 1,5 l sorgt für eine einfache Handhabung und ist mit einer praktischen Tropfstopp-Funktion ausgestattet. Sie können den Brühvorgang jederzeit unterbrechen, ohne dass etwas daneben geht. Mit der programmierbaren 24-Stunden-Timer-Funktion können Sie die Kaffeemaschine im Voraus einstellen, damit Sie jederzeit frisch gebrühten Kaffee genießen können. Für zusätzliche Komfort sorgt das Premium LCD-Display mit Drucktasten für einfache Steuerung. Sie können die Kaffeestärke nach Ihren Wünschen anpassen und für kleinere Mengen die 1-4 Tassen Einstellung nutzen. Ein integrierter Reinigungs- und Entkalkungsalarm sowie die Abschaltautomatikgarantieren eine einfache Wartung und hohe Sicherheit.<p><strong>Lieferumfang:</strong></p><ul><li>Kaffeemaschine mit Aroma-Glaskanne</li><li>Bedienungsanleitung</li></ul></p>","name_kurz":"BRAUN PurAroma 7 KF 7120","present":10},{"id":"coffee_4","name":"OK. OCM 7521 B Kaffeemaschine Schwarz","brand":"OK.","Artikelnummer":"2645420","img":"Kaffee_Bild_4.webp","preis":"17,99 €","preis_angebot":"","beschreibung":"<p>Die OK. OCM 7521 B Kaffeemaschine ist die perfekte Lösung für all Ihre Kaffeebedürfnisse. Mit einer maximalen Leistung von 750 Watt und einem Fassungsvermögen der Glaskanne von 1,25 l können Sie bis zu 10 Tassen frischen Kaffee zubereiten. Die Kaffeemaschine bietet eine praktische Tropfstopp-Funktion, die es ermöglicht, den Brühvorgang jederzeit zu unterbrechen, ohne dass Kaffeeflecken entstehen. Die Warmhaltefunktion sorgt dafür, dass Ihr Kaffee über einen längeren Zeitraum heiß bleibt, und die abnehmbare Wassertank erleichtert das Nachfüllen und Reinigen. Mit der praktischen Abschaltautomatik schaltet sich die Maschine nach dem Brühen automatisch aus, um Energie zu sparen und Ihre Sicherheit zu gewährleisten. Dank der Filtersystemgröße 4 ist die Zubereitung Ihres Kaffees besonders effizient. Diese Kaffeemaschine ist ideal für alle, die Wert auf ein gutes Preis-Leistungs-Verhältnis und eine einfache Bedienung legen.<p><strong>Lieferumfang:</strong></p><ul><li>1x Kaffeemaschine</li><li>1x Messlöffel</li><li>Bedienungsanleitung</li></ul></p>","name_kurz":"OK. OCM 7521 B"},{"id":"coffee_5","name":"JURA Z10 (EA) Cold Brew Kaffeevollautomat Aluminium Black","brand":"JURA","Artikelnummer":"2731049","img":"Kaffee_Bild_5.webp","preis":"2299,- €","preis_angebot":"","beschreibung":"<p>Der JURA Z10 (EA) Cold Brew Kaffeevollautomat bietet eine innovative Zubereitungstechnik, die anspruchsvollste Kaffeegenießer begeistert. Mit einer maximalen Leistung von 1450 Watt und einem 2,4 l Wassertank ist der Kaffeevollautomat für alle, die Wert auf höchste Qualität und Vielseitigkeit legen, die perfekte Wahl. Durch den neuen Product Recognising Grinder (P.R.G.) wird der Mahlgrad automatisch angepasst, um jede Kaffeespezialität perfekt abzustimmen. Das einzigartige Cold Brew-Verfahren sorgt für eine erfrischend ausgewogene Zubereitung – von kaltem Cold Brew Kaffee bis hin zu köstlichen Milchspezialitäten. Mit insgesamt 32 Kaffeespezialitäten, einschließlich Spezialitäten mit und ohne Milch sowie innovativen Zubereitungen wie Cold Brew Espresso und Flat White Extra Shot, ist die Z10 der perfekte Partner für individuelle Kaffeegenüsse. Das 4.3” Touchscreen-Farbdisplay bietet eine einfache Bedienung, während die One-Touch-Funktion die Zubereitung aller Spezialitäten mit nur einem Knopfdruck ermöglicht. Die individuell einstellbare Kaffeestärke, Brühtemperatur und Milchschaummenge bieten Ihnen die Freiheit, jedes Getränk nach Ihren Wünschen anzupassen. Mit WLAN- und Bluetooth-Funktionen lässt sich der Kaffeevollautomat problemlos in Ihr Smart Home integrieren. Das hochwertige Rundumdesign mit Aluminiumfront sorgt für eine stilvolle Ergänzung in jeder Küche.<p><strong>Lieferumfang:</strong></p><ul><li>Kaffeevollautomat</li><li>WiFi Connect</li><li>Behälter für Milchsystem-Reinigung</li><li>Dosierlöffel für gemahlenen Kaffee</li><li>Filterummantelung</li><li>Bedienungsanleitung</li></ul></p>","name_kurz":"JURA Z10 (EA)"},{"id":"coffee_6","name":"PHILIPS BAR300/60 Baristina Espressomaschine Schwarzgrau","brand":"PHILIPS","Artikelnummer":"2931402","img":"Kaffee_Bild_6.webp","preis":"292,99 €","preis_angebot":"","beschreibung":"<p>Die PHILIPS BAR300/60 Baristina Espressomaschine ist die perfekte Wahl für Kaffeeliebhaber, die auf der Suche nach Espresso in Barista-Qualität sind. Mit einer maximalen Leistung von 1550 Watt und einem 16 bar Pumpendruck wird der feine Geschmack der Bohnen optimal extrahiert. Diese Espressomaschine bringt die Kaffeekunst direkt in Ihre Küche und bietet Ihnen zwei Standardrezepte: Espresso und Café Crema. Die Intensitätsverstärkungsfunktion ermöglicht es Ihnen, die Stärke des Kaffees nach Ihren Wünschen anzupassen. Der integrierte Keramik-Mahlwerk sorgt für einen perfekten Mahlgrad und die ideale Dosierung des Kaffeepulvers. Ein besonderes Highlight der Baristina ist die einfache Handhabung: Mit nur einem Swipe können Sie den Siebträger herausnehmen, und der Kaffeesatz wird auf Knopfdruck entfernt – ganz ohne Kleckern und ohne versteckte Fächer zum Reinigen. Dank des kompakten Designs passt die Baristina Espressomaschine in jede Küche, ohne dabei an Leistung einzubüßen. Das Gerät arbeitet sehr leise (72 dB), sodass Sie sich ohne störende Geräu 			async function waitForContentObject() {
				while (!ContentObject.products_json) {
					await new Promise((resolve) => setTimeout(resolve, 10)); // Wait 10ms
				}
			}

			(async () => {
				await waitForContentObject(); // Wait for the data to load
				
				let content = extractURL("content");
				
				switch(content) {
					case "product":
						openProduct(extractURL("category_id"), extractURL("product_id"));
						break;
					case "category":
						initCategoryView();
						openCategory(extractURL("category_id"));
						break;
					case "main":
						initCategoryView();
						openCategory(0, true);
						break;
					case "impressum":
						openImpressum();
						break;
					default:
						/* Beim Webseitenstart ausführen */
						initCategoryView();
						openCategory(0, true);
						break;
				}
				
				if (Number(localStorage.firstStart) == 1){
					if (Number(localStorage.getItem("gruppe")) == 1) {
						openMessage("onWebshopStart_Kompetenz");
					}
					else if (Number(localStorage.getItem("gruppe")) == 2) {
						openMessage("onWebshopStart_Team");
					}
					else if (Number(localStorage.getItem("gruppe")) == 3) {
						openMessage("onWebshopStart_Autonomie");
					}
					localStorage.firstStart = 0;
				}
				else if (Number(localStorage.firstStart) != 1 && Number(localStorage.getItem("gruppe")) == 2 && localStorage.user_team == "null"){
					openMessage("teamWahl");
				}
				else if (Number(localStorage.firstStart) != 1 && Number(localStorage.getItem("gruppe")) == 3 && localStorage.user_avatar == "null"){
					openMessage("autonomieWahl");
				}
				
				window.scrollTo(0, 0);
			})();	
			
		}
		
		/* Wenn Webseite geöffnet wird */
		document.addEventListener('DOMContentLoaded', function() {
			loadContent();
		}, false);
		
		window.onpopstate = function() {
			loadContent();
		}
    </script>
