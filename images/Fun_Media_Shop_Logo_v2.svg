
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
    <!-- Background -->
    <rect width="400" height="200" fill="#ffffff"/>
    
    <!-- Icon: A screen to represent electronics -->
    <rect x="50" y="50" width="100" height="60" fill="#007BFF" rx="10"/>
    <rect x="60" y="60" width="80" height="40" fill="#ffffff" rx="5"/>
    <rect x="85" y="110" width="30" height="5" fill="#007BFF"/>
    
    <!-- Icon: A small cart to represent shopping -->
    <circle cx="190" cy="125" r="8" fill="#FF8300"/>
    <circle cx="210" cy="125" r="8" fill="#FF8300"/>
    <rect x="180" y="70" width="50" height="40" fill="#FF8300" rx="5"/>
    <line x1="180" y1="70" x2="190" y2="50" stroke="#FF8300" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="110" x2="200" y2="110" stroke="#FF8300" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Text -->
    <text x="140" y="40" font-family="Arial, sans-serif" font-size="30" fill="#333333" font-weight="bold">
        Fun Media Shop
    </text>
</svg>
